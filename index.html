<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlashMimic</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    h1 {
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(90deg, #f093fb, #f5576c, #ffd200);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 1rem;
    }
    p.tagline {
      font-size: clamp(1rem, 3vw, 1.4rem);
      color: #c8c8e0;
      margin-bottom: 2.5rem;
    }
    a.btn {
      display: inline-block;
      padding: 0.8rem 2rem;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 999px;
      color: #fff;
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s;
    }
    a.btn:hover { background: rgba(255, 255, 255, 0.12); border-color: #fff; }
    footer {
      position: fixed;
      bottom: 1.2rem;
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.45);
    }
  </style>
</head>
<body>
  <h1>FlashMimic</h1>
  <p class="tagline">Official website — coming soon.</p>
  <a class="btn" href="https://github.com/flashmimic">GitHub</a>
  <footer>&copy; 2026 FlashMimic</footer>
</body>
</html>
